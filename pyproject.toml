[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openbrushlab"
version = "0.1.0"
description = "Read-only Python BLE research lab for Oclean toothbrushes"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "third_party/*.txt"]
dependencies = ["bleak>=3.0,<4", "tzdata>=2025.2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
openbrushlab = "openbrushlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
